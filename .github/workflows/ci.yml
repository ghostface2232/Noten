name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install dependencies
        run: npm ci

      # src-tauri's generate_context! embeds the frontend dist at compile
      # time, so the app crate cannot even build without a real dist/.
      - name: Build frontend
        run: npm run build

      # The bootstrapper embeds the NSIS installer via include_bytes!, and
      # tauri_build copies bundle.resources (maintenance-helper.exe) at
      # compile time; only the release workflow produces the real files, so
      # compile against empty placeholders here. The real maintenance-helper
      # is still built and tested by `cargo test --workspace` below.
      - name: Create placeholder embedded binaries
        shell: pwsh
        run: |
          New-Item -ItemType File -Path "bootstrapper\assets\nsis-payload.exe" -Force | Out-Null
          New-Item -ItemType File -Path "src-tauri\resources\maintenance-helper.exe" -Force | Out-Null

      - name: Test helper workspace
        run: cargo test --workspace

      - name: Test Tauri app
        run: cargo test --manifest-path src-tauri/Cargo.toml
