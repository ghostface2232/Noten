name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Only a presence flag lives at job scope so the `if` gate below can read
      # it; the actual signing secret values are scoped to the signing step so
      # third-party actions (tauri-action, rust-toolchain) and dependency/build
      # steps (npm ci, cargo build) never see them.
      HAS_SIGNING_CERT: ${{ secrets.CODE_SIGN_PFX != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        # Pinned to a commit on the action's `stable` branch; toolchain input
        # keeps selecting the current stable Rust channel at build time.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Build maintenance-helper
        run: cargo build --release -p maintenance-helper

      - name: Copy maintenance-helper to Tauri resources
        shell: pwsh
        run: |
          $source = "target\release\maintenance-helper.exe"
          $dest = "src-tauri\resources\maintenance-helper.exe"
          New-Item -ItemType Directory -Path "src-tauri\resources" -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $dest -Force

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Noten v__VERSION__
          releaseDraft: true

      - name: Inject changelog into updater manifest
        # tauri-action writes latest.json with the (empty) draft release body as
        # `notes`. Replace it with changelog.json so the About tab can show the
        # new version's highlights at check time, before the update is installed.
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "[1/4] Downloading latest.json from the draft release..."
          $dir = Join-Path $PWD "updater-manifest"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          gh release download ${{ github.ref_name }} --pattern latest.json --dir $dir --clobber
          if ($LASTEXITCODE -ne 0) { throw "failed to download latest.json" }

          Write-Host "[2/4] Validating changelog.json..."
          # Applies every rule parseChangelogNotes (src/utils/changelog.ts)
          # applies, plus equal line counts, which the app does not check.
          # Syntax alone is not enough: notes the app rejects fall back to
          # rendering the raw body, which would dump this JSON at users. Fail
          # the release instead.
          $changelog = Get-Content -LiteralPath (Join-Path $PWD "changelog.json") -Raw -Encoding UTF8
          $parsed = $changelog | ConvertFrom-Json
          foreach ($loc in @("ko", "en")) {
            # PowerShell property lookup ignores case; the app's does not, so
            # "KO" would pass here and still be rejected on the client.
            if ($parsed.PSObject.Properties.Name -cnotcontains $loc) { throw "changelog.json: missing '$loc' (keys are case-sensitive)" }
            $lines = $parsed.$loc
            if ($null -eq $lines -or $lines -isnot [array]) { throw "changelog.json: '$loc' must be an array of strings" }
            if ($lines.Count -eq 0 -or $lines.Count -gt 20) { throw "changelog.json: '$loc' must hold 1-20 lines, found $($lines.Count)" }
            foreach ($line in $lines) {
              # JS trim() strips U+FEFF; .NET's whitespace test does not, so a
              # line of only that character would pass here and fail in the app.
              # (.NET also treats U+0085 as whitespace where JS does not; that
              # only makes this check stricter, which is fine.)
              if ($line -isnot [string] -or [string]::IsNullOrWhiteSpace($line.Replace([string][char]0xFEFF, ""))) { throw "changelog.json: '$loc' has an empty or non-string line" }
              if ($line.Length -gt 300) { throw "changelog.json: a '$loc' line exceeds 300 characters" }
            }
          }
          if ($parsed.ko.Count -ne $parsed.en.Count) {
            throw "changelog.json: ko has $($parsed.ko.Count) lines but en has $($parsed.en.Count)"
          }

          Write-Host "[3/4] Setting notes from changelog.json..."
          $manifestPath = Join-Path $dir "latest.json"
          $notes = ($parsed | ConvertTo-Json -Compress -Depth 5)
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $manifest.notes = $notes
          $json = $manifest | ConvertTo-Json -Depth 10
          [IO.File]::WriteAllText($manifestPath, $json, (New-Object Text.UTF8Encoding $false))

          Write-Host "[4/4] Re-uploading latest.json..."
          gh release upload ${{ github.ref_name }} $manifestPath --clobber
          if ($LASTEXITCODE -ne 0) { throw "failed to upload latest.json" }

      - name: Copy NSIS payload into bootstrapper assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "[1/1] Copying NSIS bundle to bootstrapper assets..."
          $destination = Join-Path $PWD "bootstrapper\assets\nsis-payload.exe"
          $source = Get-ChildItem (Join-Path $PWD "src-tauri\target\release\bundle\nsis\Noten_*_x64-setup.exe") |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $source) {
            throw "NSIS bundle not found under src-tauri\\target\\release\\bundle\\nsis"
          }

          Copy-Item -LiteralPath $source -Destination $destination -Force

      - name: Build bootstrapper
        run: cargo build --release -p noten-setup

      - name: Code sign bootstrapper
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "[1/3] Writing code signing certificate..."
          $certPath = Join-Path $PWD "cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CODE_SIGN_PFX))

          try {
            Write-Host "[2/3] Locating signtool..."
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $signtool) {
              throw "signtool.exe not found"
            }

            Write-Host "[3/3] Signing bootstrapper executable..."
            & $signtool sign /f $certPath /p $env:CODE_SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "target\release\noten-setup.exe"

            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Remove-Item -LiteralPath $certPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload bootstrapper to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: target/release/noten-setup.exe
